name: Deploy Docs to Fork GitHub Pages

# Fork-only preview deploy. Publishes the docs to this fork's project Pages
# site at https://<owner>.github.io/<repo>/docs/ so changes can be shared for
# review before opening an upstream PR.
#
# Project Pages serve under a /<repo> path prefix, but the source assumes a
# root domain (base /docs, links written as /docs/...). To serve correctly we:
#   1. Build with the base overridden to /<repo>/docs via env, so Astro emits
#      correct paths in HTML, CSS, AND the JS bundles (module/preload URLs that
#      a post-build string rewrite cannot safely reach).
#   2. Rewrite the hardcoded /docs/... content links in the CI checkout only
#      (ephemeral — the committed source stays clean for upstream PRs).
#   3. Drop the upstream custom-domain CNAME (a fork cannot claim it).
#
# Guarded to never run on the upstream opensearch-project repo.

on:
  workflow_dispatch:
  push:
    branches: [docs-preview]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-fork"
  cancel-in-progress: false

defaults:
  run:
    working-directory: ./docs

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    if: github.repository != 'opensearch-project/observability-stack'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: docs/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Compute path prefix
        id: prefix
        run: echo "prefix=/${GITHUB_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"

      - name: Rewrite hardcoded content links for subpath (checkout only)
        run: |
          # Prefix root-absolute links in Markdown/MDX/Astro sources so they
          # resolve under the /<repo> project-Pages path. Astro's base handles
          # its own generated assets/nav and the JS bundles; this covers the
          # hardcoded links and main-site static assets it does not rewrite.
          # Mutates the CI checkout only — committed source stays clean.
          PREFIX="${{ steps.prefix.outputs.prefix }}"
          # Docs content links (both sites)
          grep -rlE '/docs/' starlight-docs/src src 2>/dev/null | while read -r f; do
            sed -i -E "s#(\]\(|href=\"|src=\"|link: ')/docs/#\1${PREFIX}/docs/#g" "$f"
          done
          # Main-site static assets referenced from the root domain
          grep -rlE '"/(images|icons|favicon|opensearch-logo)' src 2>/dev/null | while read -r f; do
            sed -i -E "s#\"/(images/|icons/|favicon|opensearch-logo)#\"${PREFIX}/\1#g" "$f"
          done

      - name: Install dependencies
        run: npm ci

      - name: Install Starlight dependencies
        run: npm ci
        working-directory: ./docs/starlight-docs

      - name: Build main site
        env:
          MAIN_SITE: https://${{ github.repository_owner }}.github.io
          MAIN_BASE: ${{ steps.prefix.outputs.prefix }}
        run: npm run build:main

      - name: Build Starlight docs
        env:
          DOCS_SITE: https://${{ github.repository_owner }}.github.io
          DOCS_BASE: ${{ steps.prefix.outputs.prefix }}/docs
        run: npm run build
        working-directory: ./docs/starlight-docs

      - name: Merge Starlight docs into main dist
        run: |
          mkdir -p dist/docs
          cp -r starlight-docs/dist/* dist/docs/

      - name: Drop upstream custom-domain CNAME
        run: rm -f dist/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs/dist

  deploy:
    name: Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.repository != 'opensearch-project/observability-stack'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
