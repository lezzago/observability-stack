# Prometheus Alerting Rules for the OpenTelemetry Demo Application
# Only active when the otel-demo compose file is enabled.
# Mounted into Prometheus via the prometheus service override in docker-compose.otel-demo.yml.
#
# These rules target OTLP metrics pushed by the demo's microservices:
#   frontend, checkout, payment, cart, product-catalog, recommendation, shipping, ad, currency, email
#
# Rule groups:
#   - otel_demo_frontend:   Frontend and proxy latency/errors
#   - otel_demo_checkout:   Checkout pipeline health (checkout, payment, shipping)
#   - otel_demo_services:   General microservice health
#
# NOTE: Thresholds are tuned to fire under normal OTel Demo load-generator traffic
#       so the alerting pipeline can be validated end-to-end.

groups:
  # Frontend alerts — monitors user-facing latency and error rates
  - name: otel_demo_frontend
    interval: 30s
    rules:
      # Fires when any HTTP traffic exists (load generator always drives traffic)
      - alert: OtelDemoFrontendHighErrorRate
        expr: >
          sum(rate(http_server_request_duration_seconds_count{service_name="frontend"}[5m])) > 0
        for: 1m
        labels:
          severity: critical
          component: otel-demo
          service: frontend
        annotations:
          summary: "OTel Demo frontend receiving HTTP traffic"
          description: "Frontend is actively receiving requests. In a real setup this would trigger on error rate > 5%."

      # Fires when frontend P99 latency exceeds 5ms (always true under load)
      - alert: OtelDemoFrontendHighLatency
        expr: >
          histogram_quantile(0.99,
            sum by (le) (rate(http_server_request_duration_seconds_bucket{service_name=~"frontend|flagd"}[5m]))
          ) > 0.005
        for: 1m
        labels:
          severity: warning
          component: otel-demo
          service: frontend
        annotations:
          summary: "OTel Demo frontend P99 latency above 5ms"
          description: "Frontend tail latency elevated. The flagd service P99 is consistently above 4s."

      # Fires when frontend-proxy is handling any requests
      - alert: OtelDemoFrontendProxyErrors
        expr: >
          sum(rate(http_server_request_duration_seconds_count{service_name="frontend-proxy"}[5m])) > 0
        for: 1m
        labels:
          severity: warning
          component: otel-demo
          service: frontend-proxy
        annotations:
          summary: "OTel Demo frontend proxy active traffic"
          description: "Envoy proxy is actively routing requests. Monitor for elevated 5xx rates."

  # Checkout pipeline alerts — monitors the critical purchase flow
  - name: otel_demo_checkout
    interval: 30s
    rules:
      # Fires when checkout gRPC traffic exists (load generator drives purchases)
      - alert: OtelDemoCheckoutErrors
        expr: >
          sum(rate(rpc_server_duration_milliseconds_count{service_name="checkout"}[5m])) > 0
        for: 1m
        labels:
          severity: critical
          component: otel-demo
          service: checkout
        annotations:
          summary: "OTel Demo checkout service processing requests"
          description: "Checkout flow is active. Monitor for gRPC error rate spikes."

      # Fires when payment gRPC traffic exists
      - alert: OtelDemoPaymentFailures
        expr: >
          sum(rate(rpc_server_duration_milliseconds_count{service_name="payment"}[5m])) > 0
        for: 1m
        labels:
          severity: critical
          component: otel-demo
          service: payment
        annotations:
          summary: "OTel Demo payment service processing requests"
          description: "Payment pipeline is active. Check for paymentFailure feature flag if error rate increases."

      # Fires when cart gRPC traffic exists
      - alert: OtelDemoCartErrors
        expr: >
          sum(rate(rpc_server_duration_milliseconds_count{service_name="cart"}[5m])) > 0
        for: 1m
        labels:
          severity: warning
          component: otel-demo
          service: cart
        annotations:
          summary: "OTel Demo cart service processing requests"
          description: "Cart operations active. Check for cartFailure feature flag if error rate increases."

  # General microservice health — monitors all demo services
  - name: otel_demo_services
    interval: 60s
    rules:
      # Fires when any demo service has active gRPC traffic
      - alert: OtelDemoServiceHighErrorRate
        expr: >
          sum by (service_name) (rate(rpc_server_duration_milliseconds_count{
            service_name=~"ad|cart|checkout|currency|email|payment|product-catalog|recommendation|shipping|quote"
          }[5m])) > 0
        for: 1m
        labels:
          severity: warning
          component: otel-demo
        annotations:
          summary: "OTel Demo service {{ $labels.service_name }} handling gRPC traffic"
          description: "Service is actively processing requests. Monitor for elevated error rates."

      # Fires when any demo service P99 gRPC latency exceeds 10ms (always true under load)
      - alert: OtelDemoServiceHighLatency
        expr: >
          histogram_quantile(0.99,
            sum by (le, service_name) (rate(rpc_server_duration_milliseconds_bucket{
              service_name=~"ad|cart|checkout|currency|email|payment|product-catalog|recommendation|shipping|quote"
            }[5m]))
          ) > 10
        for: 1m
        labels:
          severity: warning
          component: otel-demo
        annotations:
          summary: "OTel Demo service {{ $labels.service_name }} P99 latency above 10ms"
          description: "Service tail latency elevated. Check for resource constraints or downstream issues."

      # Fires when any demo service is using memory (always true for running JVM/Python services)
      - alert: OtelDemoAdServiceHighCpu
        expr: >
          process_memory_usage_bytes{service_name=~"ad|cart|checkout|accounting|recommendation|product-reviews"} / 1024 / 1024 > 20
        for: 1m
        labels:
          severity: warning
          component: otel-demo
        annotations:
          summary: "OTel Demo service {{ $labels.service_name }} memory above 20MB"
          description: "Service memory usage elevated. The accounting service typically uses ~150MB."
