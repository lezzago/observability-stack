# Prometheus Alerting Rules for the OpenTelemetry Demo Application
# Only active when the otel-demo compose file is enabled.
# Mounted into Prometheus via the prometheus service override in docker-compose.otel-demo.yml.
#
# These rules target OTLP metrics pushed by the demo's microservices:
#   frontend, checkout, payment, cart, product-catalog, recommendation, shipping, ad, currency, email
#
# Rule groups:
#   - otel_demo_frontend:   Frontend and proxy latency/errors
#   - otel_demo_checkout:   Checkout pipeline health (checkout, payment, shipping)
#   - otel_demo_services:   General microservice health

groups:
  # Frontend alerts — monitors user-facing latency and error rates
  - name: otel_demo_frontend
    interval: 30s
    rules:
      # Fires when the frontend HTTP error rate exceeds 5%
      - alert: OtelDemoFrontendHighErrorRate
        expr: >
          (
            sum(rate(http_server_request_duration_seconds_count{service_name="frontend", http_response_status_code=~"5.."}[5m]))
            /
            sum(rate(http_server_request_duration_seconds_count{service_name="frontend"}[5m]))
          ) > 0.05
        for: 2m
        labels:
          severity: critical
          component: otel-demo
          service: frontend
        annotations:
          summary: "OTel Demo frontend HTTP error rate above 5%"
          description: "User-facing errors detected. Check frontend and downstream service health."

      # Fires when frontend P99 latency exceeds 2 seconds
      - alert: OtelDemoFrontendHighLatency
        expr: >
          histogram_quantile(0.99,
            sum by (le) (rate(http_server_request_duration_seconds_bucket{service_name="frontend"}[5m]))
          ) > 2
        for: 5m
        labels:
          severity: warning
          component: otel-demo
          service: frontend
        annotations:
          summary: "OTel Demo frontend P99 latency above 2s"
          description: "Frontend response times degraded. Check downstream dependencies."

      # Fires when frontend-proxy returns high error rates (Envoy)
      - alert: OtelDemoFrontendProxyErrors
        expr: >
          (
            sum(rate(http_server_request_duration_seconds_count{service_name="frontend-proxy", http_response_status_code=~"5.."}[5m]))
            /
            sum(rate(http_server_request_duration_seconds_count{service_name="frontend-proxy"}[5m]))
          ) > 0.1
        for: 2m
        labels:
          severity: warning
          component: otel-demo
          service: frontend-proxy
        annotations:
          summary: "OTel Demo frontend proxy error rate above 10%"
          description: "Envoy proxy is returning errors. Check backend service availability."

  # Checkout pipeline alerts — monitors the critical purchase flow
  - name: otel_demo_checkout
    interval: 30s
    rules:
      # Fires when checkout service error rate is high
      - alert: OtelDemoCheckoutErrors
        expr: >
          (
            sum(rate(rpc_server_duration_milliseconds_count{service_name="checkout", rpc_grpc_status_code!="0"}[5m]))
            /
            sum(rate(rpc_server_duration_milliseconds_count{service_name="checkout"}[5m]))
          ) > 0.1
        for: 2m
        labels:
          severity: critical
          component: otel-demo
          service: checkout
        annotations:
          summary: "OTel Demo checkout error rate above 10%"
          description: "Checkout failures detected. Check payment, shipping, and cart services."

      # Fires when payment service is returning errors (feature flag: paymentFailure)
      - alert: OtelDemoPaymentFailures
        expr: >
          (
            sum(rate(rpc_server_duration_milliseconds_count{service_name="payment", rpc_grpc_status_code!="0"}[5m]))
            /
            sum(rate(rpc_server_duration_milliseconds_count{service_name="payment"}[5m]))
          ) > 0.05
        for: 2m
        labels:
          severity: critical
          component: otel-demo
          service: payment
        annotations:
          summary: "OTel Demo payment service failure rate above 5%"
          description: "Payment processing failures detected. Check if paymentFailure feature flag is enabled."

      # Fires when cart service is returning errors (feature flag: cartFailure)
      - alert: OtelDemoCartErrors
        expr: >
          (
            sum(rate(rpc_server_duration_milliseconds_count{service_name="cart", rpc_grpc_status_code!="0"}[5m]))
            /
            sum(rate(rpc_server_duration_milliseconds_count{service_name="cart"}[5m]))
          ) > 0.1
        for: 2m
        labels:
          severity: warning
          component: otel-demo
          service: cart
        annotations:
          summary: "OTel Demo cart service error rate above 10%"
          description: "Cart operations failing. Check if cartFailure feature flag is enabled."

  # General microservice health — monitors all demo services
  - name: otel_demo_services
    interval: 60s
    rules:
      # Fires when any demo service has high gRPC error rate
      - alert: OtelDemoServiceHighErrorRate
        expr: >
          (
            sum by (service_name) (rate(rpc_server_duration_milliseconds_count{
              service_name=~"ad|cart|checkout|currency|email|payment|product-catalog|recommendation|shipping|quote",
              rpc_grpc_status_code!="0"
            }[5m]))
            /
            sum by (service_name) (rate(rpc_server_duration_milliseconds_count{
              service_name=~"ad|cart|checkout|currency|email|payment|product-catalog|recommendation|shipping|quote"
            }[5m]))
          ) > 0.2
        for: 5m
        labels:
          severity: warning
          component: otel-demo
        annotations:
          summary: "OTel Demo service {{ $labels.service_name }} error rate above 20%"
          description: "High gRPC error rate. Check service logs and feature flag configuration."

      # Fires when any demo service P99 gRPC latency exceeds 1 second
      - alert: OtelDemoServiceHighLatency
        expr: >
          histogram_quantile(0.99,
            sum by (le, service_name) (rate(rpc_server_duration_milliseconds_bucket{
              service_name=~"ad|cart|checkout|currency|email|payment|product-catalog|recommendation|shipping|quote"
            }[5m]))
          ) > 1000
        for: 5m
        labels:
          severity: warning
          component: otel-demo
        annotations:
          summary: "OTel Demo service {{ $labels.service_name }} P99 latency above 1s"
          description: "Service response times degraded. Check for resource constraints or downstream issues."

      # Fires when ad service CPU is abnormally high (feature flag: adHighCpu)
      - alert: OtelDemoAdServiceHighCpu
        expr: >
          rate(process_cpu_seconds_total{service_name="ad"}[5m]) > 0.8
        for: 5m
        labels:
          severity: warning
          component: otel-demo
          service: ad
        annotations:
          summary: "OTel Demo ad service CPU usage is high"
          description: "Ad service consuming excessive CPU. Check if adHighCpu feature flag is enabled."
